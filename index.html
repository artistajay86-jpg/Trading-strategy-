<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrade AI</title>
    <!-- Tailwind for Styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- PWA Settings -->
    <link rel="manifest" href="manifest.json">
    <style>
        body { background-color: #0a0e17; color: #e2e8f0; }
        .glass-card { background: #171c28; border: 1px solid #2d3748; transition: transform 0.2s; }
        .glass-card:hover { border-color: #10b981; transform: translateY(-2px); }
        .buy-btn { background: linear-gradient(135deg, #059669 0%, #10b981 100%); }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- Header -->
    <nav class="flex justify-between items-center mb-8 border-b border-gray-800 pb-4">
        <div>
            <h1 class="text-2xl font-bold text-emerald-500">QUANTUM<span class="text-white">TRADE</span></h1>
            <p class="text-[10px] text-gray-500 tracking-widest uppercase">Intraday Strategy Engine</p>
        </div>
        <div class="text-right">
            <div id="market-status" class="text-xs text-emerald-400 bg-emerald-400/10 px-2 py-1 rounded">● LIVE MARKET</div>
            <div class="text-[10px] text-gray-500 mt-1" id="timer">Updating...</div>
        </div>
    </nav>

    <!-- Risk Config -->
    <div class="mb-8 p-4 glass-card rounded-2xl flex flex-col md:flex-row gap-6 items-center shadow-2xl">
        <div class="w-full md:w-auto">
            <label class="block text-[10px] text-gray-500 uppercase font-bold mb-1">Trading Capital (₹)</label>
            <input type="number" id="capitalInput" value="100000" class="bg-transparent text-xl font-bold text-white border-b border-gray-700 focus:outline-none focus:border-emerald-500 w-full">
        </div>
        <div class="hidden md:block h-10 w-px bg-gray-800"></div>
        <div class="flex gap-8">
            <div>
                <span class="block text-[10px] text-gray-500 uppercase">Max Risk (1%)</span>
                <span id="riskValue" class="text-lg font-bold text-red-400">₹1,000</span>
            </div>
            <div>
                <span class="block text-[10px] text-gray-500 uppercase">RR Ratio</span>
                <span class="text-lg font-bold text-emerald-400">1:3</span>
            </div>
        </div>
    </div>

    <!-- Trade Grid -->
    <h2 class="text-sm font-bold text-gray-400 mb-4 uppercase tracking-widest flex items-center gap-2">
        <i class="fas fa-chart-line text-emerald-500"></i> Top 5 Intraday Picks
    </h2>
    
    <div id="tradesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5 gap-4">
        <!-- JS will inject 5 cards here -->
    </div>

    <script>
        // MOCK DATA: This ensures the screen is never empty
        const mockStocks = [
            { symbol: 'RELIANCE', sector: 'Energy', ltp: 2985.50, score: 94, signals: ['Narrow CPR', 'VWAP Bounce'], sl: 2970 },
            { symbol: 'TATASTEEL', sector: 'Metals', ltp: 155.20, score: 89, signals: ['Vol Spike', 'Above CPR'], sl: 153.5 },
            { symbol: 'HDFCBANK', sector: 'Banking', ltp: 1460.00, score: 85, signals: ['Price > VWAP'], sl: 1450 },
            { symbol: 'INFY', sector: 'IT', ltp: 1625.00, score: 78, signals: ['Inside Bar BO'], sl: 1615 },
            { symbol: 'SBIN', sector: 'Banking', ltp: 765.40, score: 72, signals: ['Above CPR'], sl: 760 }
        ];

        function renderTrades() {
            const container = document.getElementById('tradesContainer');
            const capital = parseFloat(document.getElementById('capitalInput').value) || 0;
            const riskPerTrade = capital * 0.01;

            container.innerHTML = mockStocks.map(stock => {
                const riskPerShare = stock.ltp - stock.sl;
                const qty = Math.floor(riskPerTrade / riskPerShare);
                const target = stock.ltp + (riskPerShare * 3);
                
                return `
                    <div class="glass-card p-5 rounded-2xl flex flex-col shadow-lg">
                        <div class="flex justify-between items-start mb-4">
                            <div>
                                <h3 class="text-xl font-black text-white">${stock.symbol}</h3>
                                <p class="text-[10px] text-gray-500 uppercase">${stock.sector}</p>
                            </div>
                            <div class="text-right">
                                <div class="text-xs font-bold text-emerald-400 bg-emerald-400/10 px-2 py-0.5 rounded">${stock.score}%</div>
                                <div class="text-sm font-mono mt-1 font-bold">₹${stock.ltp.toFixed(2)}</div>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-2 mb-4 text-[11px]">
                            <div class="bg-black/20 p-2 rounded">
                                <span class="text-gray-500 block">STOP LOSS</span>
                                <span class="text-red-400 font-bold">₹${stock.sl}</span>
                            </div>
                            <div class="bg-black/20 p-2 rounded">
                                <span class="text-gray-500 block">TARGET (1:3)</span>
                                <span class="text-emerald-400 font-bold">₹${target.toFixed(1)}</span>
                            </div>
                        </div>

                        <div class="border-t border-gray-800 pt-3 mb-4">
                            <div class="flex justify-between text-[11px] mb-1">
                                <span class="text-gray-500">Suggested Qty:</span>
                                <span class="text-white font-bold">${qty}</span>
                            </div>
                            <div class="flex justify-between text-[11px]">
                                <span class="text-gray-500">Max Risk:</span>
                                <span class="text-white">₹${(qty * riskPerShare).toFixed(0)}</span>
                            </div>
                        </div>

                        <div class="flex flex-wrap gap-1 mb-5">
                            ${stock.signals.map(s => `<span class="text-[9px] bg-gray-800 text-gray-300 px-2 py-0.5 rounded border border-gray-700">${s}</span>`).join('')}
                        </div>

                        <button class="buy-btn w-full py-3 rounded-xl text-xs font-bold text-white shadow-lg active:scale-95 transition-all uppercase tracking-wider">
                            Execute Order
                        </button>
                    </div>
                `;
            }).join('');
            
            document.getElementById('riskValue').innerText = `₹${riskPerTrade.toLocaleString()}`;
            document.getElementById('timer').innerText = "Updated: " + new Date().toLocaleTimeString();
        }

        // Event listeners
        document.getElementById('capitalInput').addEventListener('input', renderTrades);
        
        // Initial build
        renderTrades();
        
        // Simulate "Live Update" every 5 seconds
        setInterval(() => {
            mockStocks.forEach(s => s.ltp += (Math.random() - 0.5) * 2);
            renderTrades();
        }, 5000);
    </script>
</body>
</html>
